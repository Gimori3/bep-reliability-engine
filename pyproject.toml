[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bep_reliability_engine"
version = "0.0.2"
description = "Computational Architecture: Time-Dependent BEP Reliability Engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"

authors = [
    { name = "Gimori3" }
]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.1,<3.0",
    "h5py>=3.10,<4.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.5,<3.0",
    "tqdm>=4.66,<5.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
accel = [
    "numba>=0.59,<1.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black==24.4.2",
    "mypy",
    "jupyter",
    "ipykernel",
    "seaborn",
    "pre-commit",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    'slow: expensive reference-reproduction and timestep-convergence tests (deselect with -m "not slow")',
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
