[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bep_reliability_engine"
version = "1.0.0"
description = "Time-dependent backward erosion piping reliability engine for the Tokachi and Satsunai levees"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Gijs Rietman", email = "G.M.Rietman@student.tudelft.nl" },
]

keywords = [
    "backward erosion piping",
    "levee reliability",
    "flood risk",
    "Sellmeijer",
    "Monte Carlo",
    "Bayesian updating",
    "fragility curves",
    "geotechnical engineering",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.1,<3.0",
    "h5py>=3.10,<4.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.5,<3.0",
    "tqdm>=4.66,<5.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/Gimori3/bep-reliability-engine"
Documentation = "https://github.com/Gimori3/bep-reliability-engine/blob/main/docs/architecture.md"
Changelog = "https://github.com/Gimori3/bep-reliability-engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
accel = [
    "numba>=0.59,<1.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black==24.4.2",
    "mypy",
    "jupyter",
    "ipykernel",
    "seaborn",
    "pre-commit",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    'slow: expensive reference-reproduction and timestep-convergence tests (deselect with -m "not slow")',
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# The three analysis packages are the distribution; `tests` is not importable
# machinery and must not be installed as a top-level package alongside them.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "bep_reliability_engine*",
    "bayesian_reliability_updating*",
    "system_integration*",
]
