name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip environment
        run: |
          python -m pip install --upgrade pip

      - name: Install package and developer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter Static Analysis
        run: |
          ruff check .

      - name: Run Black Code Formatting Validation
        run: |
          black --check .

      - name: Run Computational Physics Test Suite
        run: |
          pytest
