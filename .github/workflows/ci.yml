name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    # Windows is the platform of record: every persisted result, every figure
    # and every number in the thesis was produced there, and the scalar-versus-
    # batch bit-identity contract (ADR-0011) is pinned against it. On Linux the
    # vectorized batch path and the scalar loop agree only to the last floating-
    # point bit in four diagnostics comparisons -- an ordinary consequence of
    # numpy taking different SIMD and libm paths for arrays than for scalars.
    # The headline gate, test_run.py::test_orchestration_matches_reference_loop,
    # holds on both. See README, "Platform".
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip environment
        run: |
          python -m pip install --upgrade pip

      - name: Install package and developer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter Static Analysis
        run: |
          ruff check .

      - name: Run Black Code Formatting Validation
        run: |
          black --check .

      - name: Run Computational Physics Test Suite
        run: |
          pytest
